<svg viewBox="0 0 1080 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WideHive five-stage pipeline">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b636e"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <!-- input -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="16" y="128" width="100" height="58" fill="#fcfcfd" stroke="#c6ccd3"/>
    <text x="66" y="153" text-anchor="middle" fill="#17191e">Input</text>
    <text x="66" y="172" text-anchor="middle" fill="#8a919c" font-size="10.5" font-weight="400">topic / list</text>
  </g>
  <line x1="116" y1="157" x2="146" y2="157" stroke="#5b636e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- top annotations -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8a919c">
    <text x="377" y="104" text-anchor="middle">strong model · few calls</text>
    <text x="576" y="104" text-anchor="middle">default model · narrow prompts · many</text>
    <text x="908" y="104" text-anchor="middle">pure code · free</text>
  </g>

  <!-- stage 1 -->
  <g>
    <rect x="150" y="118" width="126" height="78" fill="#eef6f8" stroke="#0e7490" stroke-width="1.2"/>
    <text x="213" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0a5870" letter-spacing="1">STAGE 1</text>
    <text x="213" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#17191e">Plan</text>
    <text x="213" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5b636e">main model</text>
  </g>
  <line x1="276" y1="157" x2="310" y2="157" stroke="#5b636e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- stage 2 -->
  <g>
    <rect x="314" y="118" width="140" height="78" fill="#fcfcfd" stroke="#c6ccd3" stroke-width="1.2"/>
    <text x="384" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0a5870" letter-spacing="1">STAGE 2</text>
    <text x="384" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#17191e">Enumerate</text>
    <text x="384" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5b636e">topic mode · user confirms</text>
  </g>
  <line x1="454" y1="157" x2="488" y2="157" stroke="#5b636e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- stage 3 -->
  <g>
    <rect x="492" y="118" width="168" height="78" fill="#eef6f8" stroke="#0e7490" stroke-width="1.2"/>
    <text x="576" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0a5870" letter-spacing="1">STAGE 3</text>
    <text x="576" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#17191e">Fan out ×N</text>
    <text x="576" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5b636e">batched · checkpoint · retry</text>
  </g>

  <!-- fan lines -->
  <line x1="660" y1="128" x2="708" y2="60" stroke="#0e7490" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrA)"/>
  <line x1="660" y1="157" x2="708" y2="157" stroke="#0e7490" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrA)"/>
  <line x1="660" y1="186" x2="708" y2="254" stroke="#0e7490" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrA)"/>

  <!-- workers -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10.5">
    <rect x="712" y="42" width="110" height="34" fill="#fcfcfd" stroke="#dde1e6"/>
    <text x="767" y="63" text-anchor="middle" fill="#5b636e">worker₁ … workerₖ</text>
    <rect x="712" y="140" width="110" height="34" fill="#fcfcfd" stroke="#dde1e6"/>
    <text x="767" y="161" text-anchor="middle" fill="#5b636e">worker₁ … workerₖ</text>
    <rect x="712" y="238" width="110" height="34" fill="#fcfcfd" stroke="#dde1e6"/>
    <text x="767" y="259" text-anchor="middle" fill="#5b636e">worker₁ … workerₖ</text>
    <text x="830" y="155" fill="#8a919c" font-size="10">wave = batch_size</text>
    <text x="830" y="171" fill="#8a919c" font-size="10">one file per object</text>
  </g>

  <!-- retry loop -->
  <path d="M767 276 L767 296 L576 296 L576 200" fill="none" stroke="#8a919c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="672" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8a919c">retry queue</text>

  <!-- to stage 4 -->
  <line x1="822" y1="157" x2="852" y2="157" stroke="#5b636e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- stage 4 -->
  <g>
    <rect x="856" y="118" width="104" height="78" fill="#fcfcfd" stroke="#c6ccd3" stroke-width="1.2"/>
    <text x="908" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0a5870" letter-spacing="1">STAGE 4</text>
    <text x="908" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#17191e">Merge</text>
    <text x="908" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5b636e">code · zero LLM</text>
  </g>
  <line x1="960" y1="157" x2="986" y2="157" stroke="#5b636e" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- stage 5 -->
  <g>
    <rect x="990" y="118" width="78" height="78" fill="#eef6f8" stroke="#0e7490" stroke-width="1.2"/>
    <text x="1029" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0a5870" letter-spacing="1">STG 5</text>
    <text x="1029" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#17191e">Synthesize</text>
    <text x="1029" y="179" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5b636e">main model</text>
  </g>
</svg>
