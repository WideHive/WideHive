<svg width="1080" height="320" viewBox="0 0 1080 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WideHive five-stage neon pipeline">
  <defs>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10233a"/>
      <stop offset="100%" stop-color="#0b1524"/>
    </linearGradient>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1080" height="320" fill="#0b1220"/>

  <!-- top annotations -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7dd3fc">
    <text x="377" y="98" text-anchor="middle">strong model · few calls</text>
    <text x="567" y="98" text-anchor="middle">default model · narrow prompts · many</text>
    <text x="908" y="98" text-anchor="middle">pure code · free</text>
  </g>

  <!-- input -->
  <g>
    <rect x="16" y="128" width="100" height="58" rx="8" fill="#10233a" stroke="#334f66"/>
    <text x="66" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e8fbff">Input</text>
    <text x="66" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fb3c7">topic / list</text>
  </g>
  <line x1="116" y1="157" x2="144" y2="157" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- stage 1 -->
  <g filter="url(#g2)">
    <rect x="150" y="118" width="126" height="78" rx="10" fill="#0f2438" stroke="#22d3ee" stroke-width="1.6"/>
  </g>
  <text x="213" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#67e8f9" letter-spacing="1">STAGE 1</text>
  <text x="213" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8fbff">Plan</text>
  <text x="213" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fb3c7">main model</text>
  <line x1="276" y1="157" x2="306" y2="157" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- stage 2 -->
  <g filter="url(#g2)">
    <rect x="314" y="118" width="140" height="78" rx="10" fill="#0f2438" stroke="#818cf8" stroke-width="1.4"/>
  </g>
  <text x="384" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#a5b4fc" letter-spacing="1">STAGE 2</text>
  <text x="384" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8fbff">Enumerate</text>
  <text x="384" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fb3c7">topic mode · user confirms</text>
  <line x1="454" y1="157" x2="484" y2="157" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- stage 3 -->
  <g filter="url(#g2)">
    <rect x="492" y="118" width="168" height="78" rx="10" fill="#0f2438" stroke="#22d3ee" stroke-width="1.6"/>
  </g>
  <text x="576" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#67e8f9" letter-spacing="1">STAGE 3</text>
  <text x="576" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8fbff">Fan out ×N</text>
  <text x="576" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fb3c7">batched · checkpoint · retry</text>

  <!-- fan lines -->
  <g stroke="#22d3ee" stroke-width="1.2" opacity="0.55" stroke-dasharray="4 3">
    <line x1="660" y1="128" x2="706" y2="60"/>
    <line x1="660" y1="157" x2="706" y2="157"/>
    <line x1="660" y1="186" x2="706" y2="254"/>
  </g>

  <!-- workers -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10.5">
    <rect x="710" y="42" width="112" height="34" rx="6" fill="#0f2438" stroke="#2a4a63"/>
    <text x="766" y="63" text-anchor="middle" fill="#9fd8e8">worker₁ … workerₖ</text>
    <rect x="710" y="140" width="112" height="34" rx="6" fill="#0f2438" stroke="#2a4a63"/>
    <text x="766" y="161" text-anchor="middle" fill="#9fd8e8">worker₁ … workerₖ</text>
    <rect x="710" y="238" width="112" height="34" rx="6" fill="#0f2438" stroke="#2a4a63"/>
    <text x="766" y="259" text-anchor="middle" fill="#9fd8e8">worker₁ … workerₖ</text>
    <text x="832" y="155" fill="#7dd3fc" font-size="10">wave = batch_size</text>
    <text x="832" y="171" fill="#7dd3fc" font-size="10">one file per object</text>
  </g>

  <!-- retry loop -->
  <path d="M766 276 L766 296 L576 296 L576 200" fill="none" stroke="#8fb3c7" stroke-width="1" stroke-dasharray="4 3" opacity="0.7" marker-end="url(#arr)"/>
  <text x="672" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8fb3c7">retry queue</text>

  <!-- to stage 4 -->
  <line x1="822" y1="157" x2="848" y2="157" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- stage 4 -->
  <g filter="url(#g2)">
    <rect x="852" y="118" width="104" height="78" rx="10" fill="#0f2438" stroke="#818cf8" stroke-width="1.4"/>
  </g>
  <text x="904" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#a5b4fc" letter-spacing="1">STAGE 4</text>
  <text x="904" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#17191e" opacity="0">.</text>
  <text x="904" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8fbff">Merge</text>
  <text x="904" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fb3c7">code · zero LLM</text>
  <line x1="956" y1="157" x2="982" y2="157" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- stage 5 -->
  <g filter="url(#g2)">
    <rect x="986" y="118" width="80" height="78" rx="10" fill="#0f2438" stroke="#22d3ee" stroke-width="1.6"/>
  </g>
  <text x="1026" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#67e8f9" letter-spacing="1">STG 5</text>
  <text x="1026" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e8fbff">Synthesize</text>
  <text x="1026" y="179" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#8fb3c7">main model</text>
</svg>
